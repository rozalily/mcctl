name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: npm audit --prefix dashboard --omit=dev
      - name: Check shell syntax
        run: bash -n mcctl bootstrap.sh install.sh dashboard/run completions/mcctl.bash minecraft-console minecraft-launch minecraft-stop minecraft-supervisor